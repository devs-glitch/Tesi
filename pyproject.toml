[project]
name = "qsnn"
version = "0.1.0"
description = "Quantized spiking neural networks for gravitational-wave glitch classification"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qsnn*"]